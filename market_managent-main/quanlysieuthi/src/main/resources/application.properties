# ===============================
# CẤU HÌNH KẾT NỐI DATABASE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/quanlysieuthi?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Nếu MySQL của bạn có mật khẩu thì sửa dòng trên, ví dụ:
# spring.datasource.password=123456

# ===============================
# CẤU HÌNH JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# CẤU HÌNH CỔNG CHẠY ỨNG DỤNG
# ===============================
server.port=8080

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
